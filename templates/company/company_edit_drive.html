<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Drive - Recruita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--accent:#2463a9;--bg:#f4f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb}
    body{background:var(--bg);color:var(--text)} .portal-navbar{background:var(--accent)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:.85rem;box-shadow:0 8px 24px rgba(31,41,55,.06)}
    .btn-primary{background:var(--accent);border-color:var(--accent)}.btn-primary:hover{background:#1f548e;border-color:#1f548e}
  </style>
</head>
<body>
<nav class="navbar navbar-dark portal-navbar sticky-top"><div class="container"><span class="navbar-brand fw-semibold">Recruita Company Dashboard</span><form action="{{ url_for('logout') }}" method="post"><button class="btn btn-light btn-sm" type="submit">Logout</button></form></div></nav>
<main class="container py-4">
  {% with auth_messages = get_flashed_messages(with_categories=true) %}{% if auth_messages %}{% for category, message in auth_messages %}<div class="alert alert-{{ category }} mb-4">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
  <section class="card mb-4"><div class="card-body d-flex justify-content-between align-items-center"><h1 class="h5 mb-0">Edit Placement Drive</h1><a href="{{ url_for('company_dashboard') }}" class="btn btn-outline-secondary btn-sm">Back</a></div></section>
  <section class="card mb-4"><div class="card-body"><form action="{{ url_for('edit_drive', drive_id=company_drive.drive_id) }}" method="post" class="row g-3">
    <div class="col-md-6"><label class="form-label fw-semibold" for="job-title">Job Title</label><input id="job-title" name="job_title" class="form-control" value="{{ company_drive.job_title }}" required></div>
    <div class="col-md-6"><label class="form-label fw-semibold" for="application-deadline">Application Deadline</label><input id="application-deadline" name="application_deadline" type="date" class="form-control" value="{{ company_drive.application_deadline }}" required></div>
    <div class="col-12"><label class="form-label fw-semibold" for="job-description">Job Description</label><textarea id="job-description" name="job_description" rows="4" class="form-control" required>{{ company_drive.job_description }}</textarea></div>
    <div class="col-12"><label class="form-label fw-semibold" for="eligibility-criteria">Eligibility Criteria</label><textarea id="eligibility-criteria" name="eligibility_criteria" rows="3" class="form-control" required>{{ company_drive.eligibility_criteria }}</textarea></div>
    <div class="col-12 text-end"><button class="btn btn-primary" type="submit">Save Changes</button></div>
  </form></div></section>
</main>
</body>
</html>
