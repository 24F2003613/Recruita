<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Profile - Recruita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --accent: #2a67b2;
      --bg: #f4f7fb;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    body { background: var(--bg); color: var(--text); }
    .portal-navbar { background: var(--accent); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: .85rem;
      box-shadow: 0 8px 24px rgba(31, 41, 55, .06);
    }
    .btn-primary { background: var(--accent); border-color: var(--accent); }
    .btn-primary:hover { background: #22599a; border-color: #22599a; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark portal-navbar sticky-top">
    <div class="container">
      <span class="navbar-brand fw-semibold">Recruita Student Dashboard</span>
      <form action="{{ url_for('logout') }}" method="post">
        <button class="btn btn-light btn-sm" type="submit">Logout</button>
      </form>
    </div>
  </nav>

  <main class="container py-4">
    {% with auth_messages = get_flashed_messages(with_categories=true) %}
      {% if auth_messages %}
        {% for category, message in auth_messages %}
        <div class="alert alert-{{ category }} mb-4">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <section class="card mb-4">
      <div class="card-body d-flex justify-content-between align-items-center">
        <h1 class="h5 mb-0">Edit Student Profile</h1>
        <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary btn-sm">Back</a>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <form action="{{ url_for('student_edit_profile') }}" method="post" class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="full-name">Full Name</label>
            <input id="full-name" name="full_name" class="form-control" value="{{ student_profile.full_name }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="roll-number">Roll Number</label>
            <input id="roll-number" class="form-control" value="{{ student_profile.roll_number }}" disabled>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="college">College</label>
            <input id="college" name="college" class="form-control" value="{{ student_profile.college }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="department">Department</label>
            <input id="department" name="department" class="form-control" value="{{ student_profile.department }}" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold" for="gpa">GPA</label>
            <input id="gpa" name="gpa" class="form-control" value="{{ student_profile.gpa }}" required>
          </div>
          <div class="col-md-8">
            <label class="form-label fw-semibold" for="resume">Resume (URL or file path)</label>
            <input id="resume" name="resume" class="form-control" value="{{ student_profile.resume }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="phone">Phone (Optional)</label>
            <input id="phone" name="phone" class="form-control" value="{{ student_profile.phone or '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="email">Email</label>
            <input id="email" name="email" type="email" class="form-control" value="{{ student_profile.email }}" required>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary">Save Profile</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
