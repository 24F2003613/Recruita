<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Profile - Recruita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --accent: #2a67b2;
      --bg: #f4f7fb;
      --card: #fff;
      --text: #1f2937;
      --border: #e5e7eb;
    }

    body { background: var(--bg); color: var(--text); }
    .portal-navbar { background: var(--accent); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: .85rem;
      box-shadow: 0 8px 24px rgba(31, 41, 55, .06);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark portal-navbar sticky-top">
    <div class="container">
      <span class="navbar-brand fw-semibold">Recruita Student Dashboard</span>
      <form action="{{ url_for('logout') }}" method="post">
        <button class="btn btn-light btn-sm" type="submit">Logout</button>
      </form>
    </div>
  </nav>

  <main class="container py-4">
    <section class="card mb-4">
      <div class="card-body d-flex justify-content-between align-items-center">
        <h1 class="h5 mb-0">Student Profile</h1>
        <div class="d-flex gap-2">
          <a href="{{ url_for('student_edit_profile') }}" class="btn btn-primary btn-sm">Edit Profile</a>
          <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary btn-sm">Back</a>
        </div>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Full Name</label>
            <input class="form-control" value="{{ student_profile_data.full_name }}" disabled>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Roll Number</label>
            <input class="form-control" value="{{ student_profile_data.roll_number }}" disabled>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">College</label>
            <input class="form-control" value="{{ student_profile_data.college }}" disabled>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Department</label>
            <input class="form-control" value="{{ student_profile_data.department }}" disabled>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">GPA</label>
            <input class="form-control" value="{{ student_profile_data.gpa }}" disabled>
          </div>
          <div class="col-md-8">
            <label class="form-label fw-semibold">Resume</label>
            <input class="form-control" value="{{ student_profile_data.resume }}" disabled>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Phone</label>
            <input class="form-control" value="{{ student_profile_data.phone or '' }}" disabled>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input class="form-control" value="{{ student_profile_data.email }}" disabled>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
